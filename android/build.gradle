group = 'de.ju.drawable'
version = '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Do NOT apply the Kotlin Gradle Plugin here. Flutter's tooling (3.44+) scans this
// file and applies Kotlin itself when no KGP reference is present (built-in Kotlin
// migration, see https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin).

android {
    compileSdk = 35
    namespace = 'de.ju.drawable'

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk = 26
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21 // java version
        targetCompatibility JavaVersion.VERSION_21 // java version
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
